# Unit test for the overpowered grilling skill: one turn, it must ask numbered questions
# and write nothing. Live: uv run skillbench run evals/skills --backend claude
name: grilling-asks-questions
skill_dir: ../../../overpowered          # the overpowered plugin checked out next to skillbench
prompt: /overpowered:grilling an idea for a command-line todo app
timeout_s: 600
assert:
  - skill_invoked: overpowered:grilling
  - final_text_contains: Q1
  - tool_not_called: Write
  - tool_not_called: Edit
  - exit_ok: true
