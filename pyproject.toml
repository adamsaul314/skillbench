[project]
name = "skillbench"
version = "0.1.0"
description = "Test agent skills and full agent loops against Claude Code and Copilot CLI."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.scripts]
skillbench = "skillbench.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-local-folder = ["conftest"]
